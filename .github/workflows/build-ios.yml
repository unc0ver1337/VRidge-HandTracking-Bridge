name: VRidge 2.0 MediaPipe build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pc/requirements.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Build Windows console distribution
        run: python -m pip install pyinstaller; python -m PyInstaller --noconfirm --onedir --name VRidgeHandBridge --paths . --collect-all openvr --collect-all zeroconf --exclude-module pytest --distpath artifacts/windows --workpath build/windows scripts/windows_entry.py
      - name: Smoke packaged executable
        run: artifacts/windows/VRidgeHandBridge/VRidgeHandBridge.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows/VRidgeHandBridge/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-windows
          path: test-results.xml
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test production translation math on synthetic poses
        run: clang++ -std=c++17 -O2 tests/native_translation.cpp -o /tmp/test-translation && /tmp/test-translation
      - name: Build ARM64 dynamic library
        run: bash ios/build.sh
      - name: Verify ARM64 load commands
        run: |
          file ios/build/VRidgeHandTracking.dylib
          otool -l ios/build/VRidgeHandTracking.dylib > ios/build/load-commands.txt
          shasum -a 256 ios/build/VRidgeHandTracking.dylib > ios/build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-dylib
          path: ios/build/
          retention-days: 14
