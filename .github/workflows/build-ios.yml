name: MobRecon Core ML conversion and parity
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 coremltools==9.0 numpy==1.26.4 scipy==1.15.3 opencv-python-headless==4.11.0.86 gdown==5.2.0
      - run: python scripts/convert_mobrecon.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobrecon-model
          path: |
            ios/assets/mobrecon.mlpackage/
            ios/assets/mobrecon-parity.json
