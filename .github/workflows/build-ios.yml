name: VRidge 2.5.1 Core ML build and parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pc/requirements.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Build Windows console distribution
        run: python -m pip install pyinstaller; python -m PyInstaller --noconfirm --onedir --name VRidgeHandBridge --paths . --collect-all openvr --collect-all zeroconf --exclude-module pytest --distpath artifacts/windows --workpath build/windows scripts/windows_entry.py
      - name: Smoke packaged executable without starting bridge
        run: |
          artifacts/windows/VRidgeHandBridge/VRidgeHandBridge.exe --help
          artifacts/windows/VRidgeHandBridge/VRidgeHandBridge.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows/VRidgeHandBridge/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-windows
          path: test-results.xml
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6 opencv-python-headless==4.13.0.92 coremltools==9.0
      - name: Test production translation math on synthetic poses
        run: clang++ -std=c++17 -O2 tests/native_translation.cpp -o /tmp/test-translation && /tmp/test-translation
      - name: Build ARM64 dynamic library
        run: bash ios/build.sh
      - name: Compare native geometry and crop against pinned upstream
        run: python tests/check_coreml_math.py
      - name: Compare native Core ML inference against upstream Python
        run: python tests/check_coreml_inference.py | tee ios/build/coreml-parity.json
      - name: Verify ARM64 load commands
        run: |
          file ios/build/VRidgeHandTracking.dylib
          otool -l ios/build/VRidgeHandTracking.dylib > ios/build/load-commands.txt
          shasum -a 256 ios/build/VRidgeHandTracking.dylib > ios/build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ios-coreml
          path: |
            ios/build/VRidgeHandTracking.dylib
            ios/build/hand_detector.mlmodelc/
            ios/build/hand_landmarks_detector.mlmodelc/
            ios/build/load-commands.txt
            ios/build/SHA256SUMS
            ios/build/coreml-parity.json
          retention-days: 14
