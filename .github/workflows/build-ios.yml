name: VRidge 2.6 MobRecon build and parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pc/requirements.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Build Windows console distribution
        run: python -m pip install pyinstaller; python -m PyInstaller --noconfirm --onedir --name VRidgeHandBridge --paths . --collect-all openvr --collect-all zeroconf --exclude-module pytest --distpath artifacts/windows --workpath build/windows scripts/windows_entry.py
      - name: Smoke packaged executable without starting bridge
        run: |
          artifacts/windows/VRidgeHandBridge/VRidgeHandBridge.exe --help
          artifacts/windows/VRidgeHandBridge/VRidgeHandBridge.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows/VRidgeHandBridge/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-windows
          path: test-results.xml
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 coremltools==9.0 numpy==1.26.4 scipy==1.15.3 opencv-python-headless==4.11.0.86 gdown==5.2.0 pytest scipy PyYAML zeroconf openvr
      - run: python -m pytest -q
      - name: Test ROI and camera translation math
        run: |
          clang++ -std=c++17 -O2 tests/native_mobrecon_math.cpp -o /tmp/roi && /tmp/roi
          clang++ -std=c++17 -O2 tests/native_translation.cpp -o /tmp/translation && /tmp/translation
      - name: Convert official model, verify parity, build iOS and host models
        run: bash ios/build.sh
      - name: Smoke native Vision ROI and MobRecon inference
        run: python tests/native_mobrecon_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-mobrecon
          path: |
            ios/build/VRidgeHandTracking.dylib
            ios/build/mobrecon.mlmodelc/
            ios/build/load-commands.txt
            ios/build/mobrecon-parity.json
            ios/build/native-smoke.json
          retention-days: 14
