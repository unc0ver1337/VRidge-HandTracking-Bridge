name: Private local-host IPA packaging
on:
  workflow_dispatch:
    inputs:
      ipa_path:
        description: Absolute IPA path on your private macOS runner
        required: true
      profile_path:
        description: Absolute matching provisioning profile path
        required: true
      entitlements_path:
        description: Absolute matching app entitlements plist path
        required: true
permissions:
  contents: read
jobs:
  package:
    if: github.event.repository.private == true
    runs-on: [self-hosted, macOS, vridge-private]
    steps:
      - uses: actions/checkout@v4
      - run: bash ios/build.sh
      - name: Inject and sign using local protected signing keychain
        env:
          IPA_PATH: ${{ inputs.ipa_path }}
          PROFILE_PATH: ${{ inputs.profile_path }}
          ENTITLEMENTS_PATH: ${{ inputs.entitlements_path }}
          SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: |
          test -n "$SIGN_IDENTITY"
          python3 scripts/package_ipa.py --ipa "$IPA_PATH" --dylib ios/build/VRidgeHandTracking.dylib --output private/VRidge-HandTracking-Signed.ipa --identity "$SIGN_IDENTITY" --profile "$PROFILE_PATH" --entitlements "$ENTITLEMENTS_PATH"
      # IPA stays on the user's private runner. No artifact upload or external URL.
