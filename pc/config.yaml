# Vision controls pose; Core ML controls only fingers. MCP breadth in metres.
reconstruction:
  palm_width_m: 0.085
  max_reprojection_px: 12.0
  max_angular_speed_deg: 600.0
network:
  port: 39580
  timeout_s: 3.0
  bind_ip: 0.0.0.0
  advertise_ip: null
filter:
  position_hz: 1.5
  position_beta: 3.0
  rotation_hz: 2.0
  rotation_beta: 0.25
  prediction_ms: 15
space:
  mode: hmd
  camera_offset_m:
  - 0.0
  - 0.0
  - 0.0
  camera_rotation_deg:
  - 0.0
  - 0.0
  - 0.0
  static_origin_m:
  - 0.0
  - 1.6
  - 0.0
glassvr:
  host: 127.0.0.1
  left_port: 9002
  right_port: 9001
xinput:
  index: 0
  deadzone_value: 0.18
  trigger_deadzone: 0.05
mapping:
  select_left: lb
  select_right: rb
  trigger: rt
  grip_pull: lt
  a: a
  b: b
  joy_btn: x
  system: dpad_up
  mode: y
  layout: dual
  left_menu: x
  right_menu: y
  left_system: back
  right_system: start
  left_trigger: lt
  right_trigger: rt
  left_grip: lb
  right_grip: rb
  left_stick_click: ls
  right_stick_click: rs
